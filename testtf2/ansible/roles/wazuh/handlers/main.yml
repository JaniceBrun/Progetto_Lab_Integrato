    name: wazuh-indexer
    state: restarted
    daemon_reload: true

- name: Riavvia wazuh-manager
  ansible.builtin.systemd_service:
    name: wazuh-manager
    state: restarted
    daemon_reload: true

- name: Riavvia wazuh-dashboard
  ansible.builtin.systemd_service:
    name: wazuh-dashboard
    state: restarted
    daemon_reload: true

- name: Riavvia filebeat
  ansible.builtin.systemd_service:
    name: filebeat
    state: restarted
    daemon_reload: true
