---
- name: Verifica memoria sufficiente per Wazuh Indexer
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= 3500
    fail_msg: "Wazuh all-in-one richiede almeno 3500 MB; memoria rilevata: {{ ansible_memtotal_mb }} MB."

# Installazione Wazuh all-in-one usando i pacchetti ufficiali.
- name: Importa repository APT Wazuh
  ansible.builtin.include_tasks: repo.yml

- name: Crea directory persistente per i certificati Wazuh
  ansible.builtin.file:
    path: /opt/wazuh-certs
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Scarica lo strumento ufficiale per i certificati Wazuh
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/4.14/wazuh-certs-tool.sh
    dest: /opt/wazuh-certs/wazuh-certs-tool.sh
    mode: "0750"
    force: false

- name: Installa configurazione dei certificati Wazuh
  ansible.builtin.template:
    src: config.yml.j2
    dest: /opt/wazuh-certs/config.yml
    owner: root
    group: root
    mode: "0600"

- name: Genera i certificati Wazuh una sola volta
  ansible.builtin.command:
    cmd: bash /opt/wazuh-certs/wazuh-certs-tool.sh -A
    chdir: /opt/wazuh-certs
    creates: /opt/wazuh-certs/wazuh-certificates
  register: wazuh_certs_generation
  changed_when: wazuh_certs_generation.rc == 0

- name: Verifica chiave privata della CA Wazuh
  ansible.builtin.stat:
    path: /opt/wazuh-certs/wazuh-certificates/root-ca.key
  register: wazuh_root_ca_key

- name: Segnala assenza della chiave privata CA
  ansible.builtin.assert:
    that:
      - wazuh_root_ca_key.stat.exists
    fail_msg: "Impossibile generare il certificato Filebeat: root-ca.key non esiste nella directory dei certificati Wazuh."

- name: Crea configurazione X509 del certificato Filebeat
  ansible.builtin.copy:
    dest: /opt/wazuh-certs/filebeat-ext.cnf
    mode: "0600"
    content: |
      [v3_req]
      basicConstraints = CA:FALSE
      keyUsage = critical, digitalSignature, keyEncipherment
      extendedKeyUsage = clientAuth
      subjectAltName = DNS:filebeat

- name: Genera chiave privata e CSR Filebeat
  ansible.builtin.shell:
    cmd: |
      set -e
      openssl genrsa -out /opt/wazuh-certs/wazuh-certificates/filebeat-key.pem 2048
      openssl req -new -key /opt/wazuh-certs/wazuh-certificates/filebeat-key.pem \
        -out /opt/wazuh-certs/wazuh-certificates/filebeat.csr \
        -subj '/CN=filebeat/OU=Wazuh/O=Wazuh/L=California/C=US'
    creates: /opt/wazuh-certs/wazuh-certificates/filebeat.csr

- name: Firma il certificato client Filebeat con la CA Wazuh
  ansible.builtin.command:
    cmd: >-
      openssl x509 -req
      -in /opt/wazuh-certs/wazuh-certificates/filebeat.csr
      -CA /opt/wazuh-certs/wazuh-certificates/root-ca.pem
      -CAkey /opt/wazuh-certs/wazuh-certificates/root-ca.key
      -CAcreateserial
      -out /opt/wazuh-certs/wazuh-certificates/filebeat.pem
      -days 3650
      -sha256
      -extfile /opt/wazuh-certs/filebeat-ext.cnf
      -extensions v3_req
    creates: /opt/wazuh-certs/wazuh-certificates/filebeat.pem

- name: Installa pacchetti Wazuh con versione fissata
  ansible.builtin.apt:
    name:
      - "wazuh-indexer={{ wazuh_version }}"
      - "wazuh-manager={{ wazuh_version }}"
      - "wazuh-dashboard={{ wazuh_version }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Verifica i percorsi dei certificati configurati nell'Indexer
  ansible.builtin.command:
    cmd: grep -E 'pem|certs' /etc/wazuh-indexer/opensearch.yml
  register: wazuh_indexer_cert_paths
  changed_when: false
  failed_when: false

- name: Verifica i percorsi dei certificati configurati nella Dashboard
  ansible.builtin.command:
    cmd: grep -E 'pem|certs' /etc/wazuh-dashboard/opensearch_dashboards.yml
  register: wazuh_dashboard_cert_paths
  changed_when: false
  failed_when: false

- name: Crea directory dei certificati dell'Indexer
  ansible.builtin.file:
    path: /etc/wazuh-indexer/certs
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0500"

- name: Copia certificati TLS dell'Indexer con nomi attesi
  ansible.builtin.copy:
    src: "/opt/wazuh-certs/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-indexer/certs/{{ item.dest }}"
    remote_src: true
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0400"
  loop:
    - { src: 'wazuh-indexer.pem', dest: 'indexer.pem' }
    - { src: 'wazuh-indexer-key.pem', dest: 'indexer-key.pem' }
    - { src: 'root-ca.pem', dest: 'root-ca.pem' }
    - { src: 'admin.pem', dest: 'admin.pem' }
    - { src: 'admin-key.pem', dest: 'admin-key.pem' }
  notify: Riavvia wazuh-indexer

- name: Installa configurazione completa dell'Indexer
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: /etc/wazuh-indexer/opensearch.yml
    owner: root
    group: wazuh-indexer
    mode: "0640"
  notify: Riavvia wazuh-indexer

- name: Installa supporto Python YAML
  ansible.builtin.apt:
    name: python3-yaml
    state: present

- name: Valida YAML dell'Indexer prima del restart
  ansible.builtin.command:
    cmd: python3 -c "import yaml; yaml.safe_load(open('/etc/wazuh-indexer/opensearch.yml'))"
  changed_when: false

- name: Crea la directory dell'override systemd dell'Indexer
  ansible.builtin.file:
    path: /etc/systemd/system/wazuh-indexer.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Imposta TimeoutStartSec esteso per wazuh-indexer
  ansible.builtin.copy:
    dest: /etc/systemd/system/wazuh-indexer.service.d/override.conf
    content: |
      [Service]
      TimeoutStartSec=600
    owner: root
    group: root
    mode: "0644"
  notify: Riavvia wazuh-indexer

- name: Assicura vm.max_map_count sufficiente
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_set: true
    state: present
    reload: true

- name: Abilita e avvia wazuh-indexer con diagnostica
  block:
    - name: Avvia il servizio wazuh-indexer
      ansible.builtin.systemd_service:
        name: wazuh-indexer
        enabled: true
        state: started
        daemon_reload: true

    - name: Attendi che l'Indexer sia pronto sulla porta 9200
      ansible.builtin.wait_for:
        host: "{{ wazuh_indexer_network_host }}"
        port: 9200
        timeout: 300
        delay: 10

  rescue:
    - name: Leggi gli ultimi log dell'Indexer
      ansible.builtin.command:
        cmd: journalctl -u wazuh-indexer --no-pager -o cat -n 50
      register: wazuh_indexer_journal
      changed_when: false

    - name: Mostra gli ultimi log dell'Indexer
      ansible.builtin.debug:
        msg: "{{ wazuh_indexer_journal.stdout_lines | default([]) | join('\n') }}"

    - name: Segnala il fallimento dell'Indexer
      ansible.builtin.fail:
        msg: "wazuh-indexer non è diventato disponibile sulla porta 9200."

- name: Verifica se il cluster dell'Indexer è già stato inizializzato
  ansible.builtin.stat:
    path: /var/lib/wazuh-indexer/.ansible_security_initialized
  register: wazuh_security_marker

- name: Inizializza la sicurezza dell'Indexer una sola volta
  ansible.builtin.command:
    cmd: /usr/share/wazuh-indexer/bin/indexer-security-init.sh
  when: not wazuh_security_marker.stat.exists
  register: wazuh_security_init
  changed_when: wazuh_security_init.rc == 0

- name: Crea marker dell'inizializzazione della sicurezza
  ansible.builtin.file:
    path: /var/lib/wazuh-indexer/.ansible_security_initialized
    state: touch
    owner: root
    group: wazuh-indexer
    mode: "0600"
  when: not wazuh_security_marker.stat.exists

- name: Verifica la salute dell'Indexer tramite certificato admin
  ansible.builtin.uri:
    url: "https://{{ wazuh_indexer_network_host }}:9200/_cluster/health"
    method: GET
    validate_certs: false
    client_cert: /etc/wazuh-indexer/certs/admin.pem
    client_key: /etc/wazuh-indexer/certs/admin-key.pem
    ca_path: /etc/wazuh-indexer/certs/root-ca.pem
    status_code: 200
  register: wazuh_indexer_health
  retries: 30
  delay: 10
  until:
    - wazuh_indexer_health.status == 200
    - wazuh_indexer_health.json.status in ['green', 'yellow']

- name: Crea directory dei certificati del Manager
  ansible.builtin.file:
    path: /etc/wazuh-manager/certs
    state: directory
    owner: root
    group: wazuh
    mode: "0750"

- name: Distribuisci certificati TLS del Manager
  ansible.builtin.copy:
    src: "/opt/wazuh-certs/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-manager/certs/{{ item.dest }}"
    remote_src: true
    owner: root
    group: wazuh
    mode: "0640"
  loop:
    - { src: 'wazuh-manager.pem', dest: 'wazuh-manager.pem' }
    - { src: 'wazuh-manager-key.pem', dest: 'wazuh-manager-key.pem' }
    - { src: 'root-ca.pem', dest: 'root-ca.pem' }
  notify: Riavvia wazuh-manager

- name: Abilita e avvia wazuh-manager
  ansible.builtin.systemd_service:
    name: wazuh-manager
    enabled: true
    state: started
    daemon_reload: true

- name: Crea directory dei certificati della Dashboard
  ansible.builtin.file:
    path: /etc/wazuh-dashboard/certs
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0500"

- name: Distribuisci certificati TLS della Dashboard con nomi attesi
  ansible.builtin.copy:
    src: "/opt/wazuh-certs/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-dashboard/certs/{{ item.dest }}"
    remote_src: true
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0400"
  loop:
    - { src: 'wazuh-dashboard.pem', dest: 'dashboard.pem' }
    - { src: 'wazuh-dashboard-key.pem', dest: 'dashboard-key.pem' }
    - { src: 'root-ca.pem', dest: 'root-ca.pem' }
  notify: Riavvia wazuh-dashboard

- name: Configura l'endpoint dell'Indexer nella Dashboard
  ansible.builtin.lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^opensearch\.hosts:'
    line: 'opensearch.hosts: ["https://{{ wazuh_manager_ip }}:9200"]'
  notify: Riavvia wazuh-dashboard

- name: Abilita e avvia wazuh-dashboard
  ansible.builtin.systemd_service:
    name: wazuh-dashboard
    enabled: true
    state: started
    daemon_reload: true

- name: Attendi porta agente 1514
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 1514
    timeout: 300

- name: Attendi porta registrazione agente 1515
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 1515
    timeout: 300

- name: Attendi API Indexer 9200
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 9200
    timeout: 300

- name: Attendi Dashboard HTTPS 443
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 443
    timeout: 300

- name: Crea directory della password amministratore locale Wazuh
  ansible.builtin.file:
    path: /etc/wazuh-dashboard
    state: directory
    owner: root
    group: wazuh-dashboard
    mode: "0700"

- name: Verifica se esiste la password amministratore locale Wazuh
  ansible.builtin.stat:
    path: /etc/wazuh-dashboard/.wazuh_admin_pass
  register: wazuh_admin_password_file

- name: Genera password amministratore locale Wazuh una sola volta
  ansible.builtin.copy:
    dest: /etc/wazuh-dashboard/.wazuh_admin_pass
    content: "{{ lookup('password', '/dev/null', length=32, chars='ascii_letters,digits') }}\n"
    owner: root
    group: wazuh-dashboard
    mode: "0600"
    force: false
  when: not wazuh_admin_password_file.stat.exists
  no_log: true

- name: Imposta permessi alla password amministratore locale Wazuh
  ansible.builtin.file:
    path: /etc/wazuh-dashboard/.wazuh_admin_pass
    owner: root
    group: wazuh-dashboard
    mode: "0600"

- name: Imposta heap iniziale JVM dell'Indexer
  ansible.builtin.lineinfile:
    path: /etc/wazuh-indexer/jvm.options
    regexp: '^-Xms'
    line: "-Xms{{ wazuh_indexer_heap }}"
  notify: Riavvia wazuh-indexer

- name: Imposta heap massimo JVM dell'Indexer
  ansible.builtin.lineinfile:
    path: /etc/wazuh-indexer/jvm.options
    regexp: '^-Xmx'
    line: "-Xmx{{ wazuh_indexer_heap }}"
  notify: Riavvia wazuh-indexer

- name: Installa Filebeat
  ansible.builtin.apt:
    name: filebeat
    state: present

- name: Scarica configurazione ufficiale Filebeat Wazuh
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/4.14/tpl/wazuh/filebeat/filebeat.yml
    dest: /etc/filebeat/filebeat.yml
    mode: "0640"

- name: Configura endpoint dell'Indexer tramite variabile Ansible
  ansible.builtin.lineinfile:
    path: /etc/filebeat/filebeat.yml
    regexp: '^\s*hosts:\s*.*'
    line: '  hosts: ["{{ wazuh_manager_ip }}:9200"]'
  notify: Riavvia filebeat

- name: Scarica template Wazuh per Filebeat
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/wazuh/wazuh/v{{ wazuh_version | regex_replace('-.*$', '') }}/extensions/elasticsearch/7.x/wazuh-template.json"
    dest: /etc/filebeat/wazuh-template.json
    mode: "0644"

- name: Crea directory dei certificati client Filebeat
  ansible.builtin.file:
    path: /etc/filebeat/certs
    state: directory
    owner: root
    group: root
    mode: "0500"

- name: Distribuisci certificato client dedicato Filebeat
  ansible.builtin.copy:
    src: "/opt/wazuh-certs/wazuh-certificates/{{ item.src }}"
    dest: "/etc/filebeat/certs/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0400"
  loop:
    - { src: 'filebeat.pem', dest: 'filebeat.pem' }
    - { src: 'filebeat-key.pem', dest: 'filebeat-key.pem' }
    - { src: 'root-ca.pem', dest: 'root-ca.pem' }
  notify: Riavvia filebeat

- name: Verifica subject del certificato Filebeat
  ansible.builtin.command:
    cmd: openssl x509 -in /etc/filebeat/certs/filebeat.pem -noout -subject -issuer
  changed_when: false

- name: Configura certificati mutual TLS di Filebeat
  ansible.builtin.lineinfile:
    path: /etc/filebeat/filebeat.yml
    regexp: '^\s*ssl\.{{ item.key }}:\s*.*'
    line: '  ssl.{{ item.key }}: {{ item.value }}'
  loop:
    - { key: 'certificate_authorities', value: '["/etc/filebeat/certs/root-ca.pem"]' }
    - { key: 'certificate', value: '"/etc/filebeat/certs/filebeat.pem"' }
    - { key: 'key', value: '"/etc/filebeat/certs/filebeat-key.pem"' }
  notify: Riavvia filebeat

- name: Crea file swap da 2 GB per Wazuh all-in-one
  ansible.builtin.command:
    cmd: fallocate -l 2G /swapfile
  args:
    creates: /swapfile

- name: Imposta permessi del file swap
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Inizializza il file swap
  ansible.builtin.command:
    cmd: mkswap /swapfile
  register: wazuh_mkswap
  changed_when: wazuh_mkswap.rc == 0
  when: not ansible_facts.swaptotal_mb | default(0) > 0

- name: Attiva il file swap
  ansible.builtin.command:
    cmd: swapon /swapfile
  register: wazuh_swapon
  changed_when: wazuh_swapon.rc == 0
  failed_when: false
  when: not ansible_facts.swaptotal_mb | default(0) > 0

- name: Registra il file swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s+'
    line: '/swapfile none swap sw 0 0'

- name: Imposta vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
    state: present
    reload: true

- name: Verifica se il keystore Filebeat esiste
  ansible.builtin.stat:
    path: /etc/filebeat/filebeat.keystore
  register: wazuh_filebeat_keystore

- name: Crea keystore Filebeat
  ansible.builtin.command:
    cmd: filebeat keystore create
  when: not wazuh_filebeat_keystore.stat.exists

- name: Imposta username nel keystore Filebeat
  ansible.builtin.shell:
    cmd: "printf '%s' '{{ wazuh_indexer_admin_username }}' | filebeat keystore add username --stdin --force"
  changed_when: true
  no_log: true

- name: Imposta password nel keystore Filebeat
  ansible.builtin.shell:
    cmd: "printf '%s' '{{ wazuh_indexer_admin_password }}' | filebeat keystore add password --stdin --force"
  changed_when: true
  no_log: true
  when: wazuh_indexer_admin_password | length > 0

- name: Scarica modulo ufficiale Wazuh per Filebeat
  ansible.builtin.unarchive:
    src: "https://packages.wazuh.com/4.x/filebeat/wazuh-filebeat-0.4.tar.gz"
    dest: /usr/share/filebeat/module
    remote_src: true
    creates: /usr/share/filebeat/module/wazuh

- name: Verifica blocco persistente di creazione indici
  ansible.builtin.uri:
    url: "https://{{ wazuh_indexer_network_host }}:9200/_cluster/settings?include_defaults=true"
    method: GET
    validate_certs: false
    client_cert: /etc/wazuh-indexer/certs/admin.pem
    client_key: /etc/wazuh-indexer/certs/admin-key.pem
    ca_path: /etc/wazuh-indexer/certs/root-ca.pem
    status_code: 200
  register: wazuh_cluster_settings

- name: Rimuovi blocco persistente se presente
  ansible.builtin.uri:
    url: "https://{{ wazuh_indexer_network_host }}:9200/_cluster/settings"
    method: PUT
    validate_certs: false
    client_cert: /etc/wazuh-indexer/certs/admin.pem
    client_key: /etc/wazuh-indexer/certs/admin-key.pem
    ca_path: /etc/wazuh-indexer/certs/root-ca.pem
    headers:
      Content-Type: application/json
    body_format: json
    body:
      persistent:
        cluster.blocks.create_index: null
    status_code: 200
  when:
    - wazuh_cluster_settings.json.persistent is defined
    - wazuh_cluster_settings.json.persistent['cluster.blocks.create_index'] | default(false) | string | lower == 'true'
