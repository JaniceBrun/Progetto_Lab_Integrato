---
- name: Verifica memoria sufficiente per Wazuh Indexer
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= 3500
    fail_msg: "Wazuh all-in-one richiede almeno 3500 MB; memoria rilevata: {{ ansible_memtotal_mb }} MB."

# Installazione Wazuh all-in-one usando i pacchetti ufficiali.
- name: Importa repository APT Wazuh
  ansible.builtin.include_tasks: repo.yml

- name: Crea directory persistente per i certificati Wazuh
  ansible.builtin.file:
    path: /opt/wazuh-certs
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Scarica lo strumento ufficiale per i certificati Wazuh
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/4.14/wazuh-certs-tool.sh
    dest: /opt/wazuh-certs/wazuh-certs-tool.sh
    mode: "0750"
    force: false

- name: Installa configurazione dei certificati Wazuh
  ansible.builtin.template:
    src: config.yml.j2
    dest: /opt/wazuh-certs/config.yml
    owner: root
    group: root
    mode: "0600"

- name: Genera i certificati Wazuh una sola volta
  ansible.builtin.command:
    cmd: bash /opt/wazuh-certs/wazuh-certs-tool.sh -A
    chdir: /opt/wazuh-certs
    creates: /opt/wazuh-certs/wazuh-certificates
  register: wazuh_certs_generation
  changed_when: wazuh_certs_generation.rc == 0

- name: Installa pacchetti Wazuh con versione fissata
  ansible.builtin.apt:
    name:
      - "wazuh-indexer={{ wazuh_version }}"
      - "wazuh-manager={{ wazuh_version }}"
      - "wazuh-dashboard={{ wazuh_version }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Verifica i percorsi dei certificati configurati nell'Indexer
  ansible.builtin.command:
    cmd: grep -E 'pem|certs' /etc/wazuh-indexer/opensearch.yml
  register: wazuh_indexer_cert_paths
  changed_when: false
  failed_when: false

- name: Verifica i percorsi dei certificati configurati nella Dashboard
  ansible.builtin.command:
    cmd: grep -E 'pem|certs' /etc/wazuh-dashboard/opensearch_dashboards.yml
  register: wazuh_dashboard_cert_paths
  changed_when: false
  failed_when: false

- name: Crea directory dei certificati dell'Indexer
  ansible.builtin.file:
    path: /etc/wazuh-indexer/certs
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0500"

- name: Copia certificati TLS dell'Indexer con nomi attesi
  ansible.builtin.copy:
    src: "/opt/wazuh-certs/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-indexer/certs/{{ item.dest }}"
    remote_src: true
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0400"
  loop:
    - { src: 'wazuh-indexer.pem', dest: 'indexer.pem' }
    - { src: 'wazuh-indexer-key.pem', dest: 'indexer-key.pem' }
    - { src: 'root-ca.pem', dest: 'root-ca.pem' }
    - { src: 'admin.pem', dest: 'admin.pem' }
    - { src: 'admin-key.pem', dest: 'admin-key.pem' }
  notify: Riavvia wazuh-indexer

- name: Configura il nome del nodo dell'Indexer
  ansible.builtin.lineinfile:
    path: /etc/wazuh-indexer/opensearch.yml
    regexp: '^node\.name:'
    line: "node.name: wazuh-indexer"
  notify: Riavvia wazuh-indexer

- name: Configura le informazioni dei nodi dell'Indexer
  ansible.builtin.lineinfile:
    path: /etc/wazuh-indexer/opensearch.yml
    regexp: '^network\.host:'
    line: "network.host: 0.0.0.0"
  notify: Riavvia wazuh-indexer

- name: Imposta heap iniziale JVM dell'Indexer
  ansible.builtin.lineinfile:
    path: /etc/wazuh-indexer/jvm.options
    regexp: '^-Xms'
    line: "-Xms{{ wazuh_indexer_heap }}"
  notify: Riavvia wazuh-indexer

- name: Imposta heap massimo JVM dell'Indexer
  ansible.builtin.lineinfile:
    path: /etc/wazuh-indexer/jvm.options
    regexp: '^-Xmx'
    line: "-Xmx{{ wazuh_indexer_heap }}"
  notify: Riavvia wazuh-indexer

- name: Abilita e avvia wazuh-indexer con diagnostica
  block:
    - name: Avvia il servizio wazuh-indexer
      ansible.builtin.systemd_service:
        name: wazuh-indexer
        enabled: true
        state: started
        daemon_reload: true

    - name: Attendi che l'Indexer sia pronto sulla porta 9200
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 9200
        timeout: 300

  rescue:
    - name: Leggi gli ultimi log dell'Indexer
      ansible.builtin.command:
        cmd: journalctl -u wazuh-indexer --no-pager -o cat -n 50
      register: wazuh_indexer_journal
      changed_when: false

    - name: Mostra gli ultimi log dell'Indexer
      ansible.builtin.debug:
        msg: "{{ wazuh_indexer_journal.stdout_lines | default([]) | join('\n') }}"

    - name: Segnala il fallimento dell'Indexer
      ansible.builtin.fail:
        msg: "wazuh-indexer non è diventato disponibile sulla porta 9200."

- name: Attendi che l'Indexer sia pronto sulla porta 9200
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 9200
    timeout: 300

- name: Verifica se il cluster dell'Indexer è già stato inizializzato
  ansible.builtin.stat:
    path: /var/lib/wazuh-indexer/.ansible_security_initialized
  register: wazuh_security_marker

- name: Inizializza la sicurezza dell'Indexer una sola volta
  ansible.builtin.command:
    cmd: /usr/share/wazuh-indexer/bin/indexer-security-init.sh
  when: not wazuh_security_marker.stat.exists
  register: wazuh_security_init
  changed_when: wazuh_security_init.rc == 0

- name: Crea marker dell'inizializzazione della sicurezza
  ansible.builtin.file:
    path: /var/lib/wazuh-indexer/.ansible_security_initialized
    state: touch
    owner: root
    group: wazuh-indexer
    mode: "0600"
  when: not wazuh_security_marker.stat.exists

- name: Crea directory dei certificati del Manager
  ansible.builtin.file:
    path: /etc/wazuh-manager/certs
    state: directory
    owner: root
    group: wazuh
    mode: "0750"

- name: Distribuisci certificati TLS del Manager
  ansible.builtin.copy:
    src: "/opt/wazuh-certs/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-manager/certs/{{ item.dest }}"
    remote_src: true
    owner: root
    group: wazuh
    mode: "0640"
  loop:
    - { src: 'wazuh-manager.pem', dest: 'wazuh-manager.pem' }
    - { src: 'wazuh-manager-key.pem', dest: 'wazuh-manager-key.pem' }
    - { src: 'root-ca.pem', dest: 'root-ca.pem' }
  notify: Riavvia wazuh-manager

- name: Abilita e avvia wazuh-manager
  ansible.builtin.systemd_service:
    name: wazuh-manager
    enabled: true
    state: started
    daemon_reload: true

- name: Crea directory dei certificati della Dashboard
  ansible.builtin.file:
    path: /etc/wazuh-dashboard/certs
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0500"

- name: Distribuisci certificati TLS della Dashboard con nomi attesi
  ansible.builtin.copy:
    src: "/opt/wazuh-certs/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-dashboard/certs/{{ item.dest }}"
    remote_src: true
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0400"
  loop:
    - { src: 'wazuh-dashboard.pem', dest: 'dashboard.pem' }
    - { src: 'wazuh-dashboard-key.pem', dest: 'dashboard-key.pem' }
    - { src: 'root-ca.pem', dest: 'root-ca.pem' }
  notify: Riavvia wazuh-dashboard

- name: Configura l'endpoint dell'Indexer nella Dashboard
  ansible.builtin.lineinfile:
    path: /etc/wazuh-dashboard/opensearch_dashboards.yml
    regexp: '^opensearch\.hosts:'
    line: 'opensearch.hosts: ["https://{{ wazuh_manager_ip }}:9200"]'
  notify: Riavvia wazuh-dashboard

- name: Abilita e avvia wazuh-dashboard
  ansible.builtin.systemd_service:
    name: wazuh-dashboard
    enabled: true
    state: started
    daemon_reload: true

- name: Attendi porta agente 1514
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 1514
    timeout: 300

- name: Attendi porta registrazione agente 1515
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 1515
    timeout: 300

- name: Attendi API Indexer 9200
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 9200
    timeout: 300

- name: Attendi Dashboard HTTPS 443
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 443
    timeout: 300

- name: Crea directory della password amministratore locale Wazuh
  ansible.builtin.file:
    path: /etc/wazuh-dashboard
    state: directory
    owner: root
    group: wazuh-dashboard
    mode: "0700"

- name: Verifica se esiste la password amministratore locale Wazuh
  ansible.builtin.stat:
    path: /etc/wazuh-dashboard/.wazuh_admin_pass
  register: wazuh_admin_password_file

- name: Genera password amministratore locale Wazuh una sola volta
  ansible.builtin.copy:
    dest: /etc/wazuh-dashboard/.wazuh_admin_pass
    content: "{{ lookup('password', '/dev/null', length=32, chars='ascii_letters,digits') }}\n"
    owner: root
    group: wazuh-dashboard
    mode: "0600"
    force: false
  when: not wazuh_admin_password_file.stat.exists
  no_log: true

- name: Imposta permessi alla password amministratore locale Wazuh
  ansible.builtin.file:
    path: /etc/wazuh-dashboard/.wazuh_admin_pass
    owner: root
    group: wazuh-dashboard
    mode: "0600"
