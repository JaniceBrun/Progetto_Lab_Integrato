---
- name: Installa nginx e ModSecurity
  apt:
    name:
      - nginx
      - libnginx-mod-security2
      - git
    state: present
    update_cache: true

- name: Clona OWASP CRS
  git:
    repo: https://github.com/coreruleset/coreruleset.git
    dest: /etc/nginx/modsecurity-crs
    version: main

- name: Copia configurazione CRS
  copy:
    src: /etc/nginx/modsecurity-crs/crs-setup.conf.example
    dest: /etc/nginx/modsecurity-crs/crs-setup.conf
    remote_src: true

- name: Crea directory modsecurity se non esiste
  file:
    path: /etc/modsecurity
    state: directory
    mode: "0755"

- name: Deploy modsecurity.conf da template
  template:
    src: modsecurity.conf.j2
    dest: /etc/modsecurity/modsecurity.conf

- name: Deploy nginx vhost da template
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default

- name: Verifica configurazione nginx
  command: nginx -t
  changed_when: false

- name: Abilita e avvia nginx
  systemd:
    name: nginx
    enabled: true
    state: restarted
